[project]
name = "wheel-legged-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium>=1.3.0",
    "mjlab[cu128]",
    "numpy>=2.4.6",
    "pygame>=2.6.1",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.20.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.uv.sources]
mjlab = { path = "../mjlab-main", editable = true }
mujoco = { path = "vendor/wheels/mujoco-3.8.1.dev913242127-cp311-cp311-win_amd64.whl" }
torch = { index = "pytorch-cu128" }
warp-lang = { index = "nvidia" }

[tool.uv]
# py.mujoco.org pruned the exact nightly used for the frozen evidence. Keep a
# byte-pinned local wheel so a clean machine restores the same physics runtime.
override-dependencies = ["mujoco==3.8.1.dev913242127"]
environments = ["sys_platform == 'win32' and python_version == '3.11'"]
