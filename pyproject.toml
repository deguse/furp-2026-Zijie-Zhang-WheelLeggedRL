[project]
name = "wheel-legged-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium>=1.3.0",
    "mjlab[cu128]",
    "numpy>=2.4.6",
    "pygame>=2.6.1",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.20.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "py-mujoco"
url = "https://py.mujoco.org/"
explicit = true

[tool.uv.sources]
mjlab = { path = "../mjlab-main", editable = true }
mujoco = { index = "py-mujoco" }
torch = { index = "pytorch-cu128" }
warp-lang = { index = "nvidia" }

[tool.uv]
# MuJoCo nightly wheels are pruned from py.mujoco.org. The 3.8 nightly locked
# by mjlab v1.4.0 is no longer downloadable, so Hybrid v2 pins the currently
# available Windows/Python 3.11-compatible nightly explicitly.
override-dependencies = ["mujoco==3.9.0.dev914774489"]
environments = ["sys_platform == 'win32' and python_version < '3.13'"]
